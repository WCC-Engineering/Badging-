<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 215" role="img" aria-label="Parts that fit together need a 0.2 to 0.3 millimeter gap; designing them the exact same size means they won't fit"><title>Parts that fit together need a 0.2 to 0.3 millimeter gap; designing them the exact same size means they won't fit</title><defs><pattern id="layers" width="8" height="6" patternUnits="userSpaceOnUse"><rect width="8" height="6" fill="#4A90C8"/><line x1="0" y1="5.5" x2="8" y2="5.5" stroke="#1F4E79" stroke-opacity=".35"/></pattern><pattern id="sup" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#FFF"/><line x1="3" y1="0" x2="3" y2="6" stroke="#E3A33B" stroke-width="2"/></pattern></defs><rect width="480" height="215" rx="12" fill="#FFF"/><g transform="translate(0,0)"><rect x="60" y="110" width="120" height="60" fill="url(#layers)" stroke="#1F4E79" stroke-width="1.5"/><rect x="104" y="110" width="32" height="40" fill="#FFF"/><rect x="107" y="60" width="26" height="85" fill="#9CCB7F" stroke="#3E6B2A" stroke-width="1.5"/><text x="150" y="100" font-family="Arial" font-size="11" fill="#333">0.2–0.3 mm gap</text><rect x="20" y="170" width="200" height="8" fill="#5A6370"/><circle cx="74.4" cy="195" r="8" fill="#2E7D32"/><path d="M70.4 195 l3 3 l6 -7" fill="none" stroke="#FFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="88.4" y="200" font-family="Arial" font-size="14" font-weight="700" fill="#2E7D32">Leave a gap</text></g><g transform="translate(240,0)"><rect x="60" y="110" width="120" height="60" fill="url(#layers)" stroke="#1F4E79" stroke-width="1.5"/><rect x="106" y="110" width="28" height="40" fill="#FFF"/><rect x="104" y="60" width="32" height="48" fill="#9CCB7F" stroke="#3E6B2A" stroke-width="1.5"/><text x="148" y="90" font-family="Arial" font-size="11" fill="#333">same size:</text><text x="148" y="104" font-family="Arial" font-size="11" fill="#333">won't fit</text><rect x="20" y="170" width="200" height="8" fill="#5A6370"/><circle cx="60.0" cy="195" r="8" fill="#C62828"/><path d="M56.5 191.5 l7 7 M63.5 191.5 l-7 7" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/><text x="74.0" y="200" font-family="Arial" font-size="14" font-weight="700" fill="#C62828">Exact same size</text></g><line x1="240" y1="20" x2="240" y2="185" stroke="#DDD"/></svg>