<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 215" role="img" aria-label="Overhangs up to about 45 degrees print fine; a flat overhang past 45 degrees needs supports"><title>Overhangs up to about 45 degrees print fine; a flat overhang past 45 degrees needs supports</title><defs><pattern id="layers" width="8" height="6" patternUnits="userSpaceOnUse"><rect width="8" height="6" fill="#4A90C8"/><line x1="0" y1="5.5" x2="8" y2="5.5" stroke="#1F4E79" stroke-opacity=".35"/></pattern><pattern id="sup" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#FFF"/><line x1="3" y1="0" x2="3" y2="6" stroke="#E3A33B" stroke-width="2"/></pattern></defs><rect width="480" height="215" rx="12" fill="#FFF"/><g transform="translate(0,0)"><path d="M60 170 L120 170 L180 110 L180 90 L160 90 L110 140 L60 140 Z" fill="url(#layers)" stroke="#1F4E79" stroke-width="1.5"/><text x="150" y="160" font-family="Arial" font-size="12" fill="#333">45° or less</text><rect x="20" y="170" width="200" height="8" fill="#5A6370"/><circle cx="31.200000000000003" cy="195" r="8" fill="#2E7D32"/><path d="M27.200000000000003 195 l3 3 l6 -7" fill="none" stroke="#FFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45.2" y="200" font-family="Arial" font-size="14" font-weight="700" fill="#2E7D32">Up to ~45°: no supports</text></g><g transform="translate(240,0)"><path d="M50 170 L90 170 L90 120 L200 120 L200 95 L50 95 Z" fill="url(#layers)" stroke="#1F4E79" stroke-width="1.5"/><rect x="90" y="120" width="110" height="50" fill="url(#sup)" stroke="#E3A33B"/><text x="145" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">supports</text><rect x="20" y="170" width="200" height="8" fill="#5A6370"/><circle cx="27.599999999999994" cy="195" r="8" fill="#C62828"/><path d="M24.099999999999994 191.5 l7 7 M31.099999999999994 191.5 l-7 7" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/><text x="41.599999999999994" y="200" font-family="Arial" font-size="14" font-weight="700" fill="#C62828">Past 45°: needs supports</text></g><line x1="240" y1="20" x2="240" y2="185" stroke="#DDD"/></svg>