<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 215" role="img" aria-label="Keep features at least as thick as the sheet; very thin features snap off"><title>Keep features at least as thick as the sheet; very thin features snap off</title><rect width="480" height="215" rx="12" fill="#FFF"/><g transform="translate(0,0)"><rect x="25" y="25" width="190" height="150" rx="3" fill="#E8C38E" stroke="#9C7440"/><path d="M50 120 L190 120 L190 150 L50 150 Z M95 120 L95 70 L120 70 L120 120" fill="none" stroke="#D32F2F" stroke-width="3"/><text x="155" y="92" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">tab ≥ sheet</text><text x="155" y="106" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">thickness</text><circle cx="70.8" cy="195" r="8" fill="#2E7D32"/><path d="M66.8 195 l3 3 l6 -7" fill="none" stroke="#FFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="84.8" y="200" font-family="Arial" font-size="14" font-weight="700" fill="#2E7D32">Thick enough</text></g><g transform="translate(240,0)"><rect x="25" y="25" width="190" height="150" rx="3" fill="#E8C38E" stroke="#9C7440"/><path d="M50 120 L190 120 L190 150 L50 150 Z M104 120 L104 60 L110 60 L110 120" fill="none" stroke="#D32F2F" stroke-width="3"/><text x="160" y="92" text-anchor="middle" font-family="Arial" font-size="12" fill="#C62828">too thin:</text><text x="160" y="106" text-anchor="middle" font-family="Arial" font-size="12" fill="#C62828">snaps off</text><circle cx="34.8" cy="195" r="8" fill="#C62828"/><path d="M31.299999999999997 191.5 l7 7 M38.3 191.5 l-7 7" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/><text x="48.8" y="200" font-family="Arial" font-size="14" font-weight="700" fill="#C62828">Thinner than the sheet</text></g><line x1="240" y1="20" x2="240" y2="185" stroke="#DDD"/><text x="470" y="16" text-anchor="end" font-family="Arial" font-size="10" fill="#888">top view</text></svg>